# Phase D: dashboards in ./aquarius/*.json are loaded at start and re-read every 30 s.
# They are generated by grafana/build_dashboards.py; edit that, then run it.
apiVersion: 1
providers:
  - name: aquarius
    folder: Aquarius
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/aquarius
