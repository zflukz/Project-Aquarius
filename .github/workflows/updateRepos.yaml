
name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync-to-gitlab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitLab remote
        run: |
          git remote add gitlab "https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_TOKEN }}@git.cpe.kmutt.ac.th/senior-droneswarm/drone-aquarius.git"

      - name: Push to GitLab
        run: |
          git push gitlab main:main --force
