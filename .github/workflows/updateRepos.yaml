name: Sync GitHub to GitLab
on:
  push:
    branches:
      - main

jobs:
  sync-to-gitlab:
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GitLab token
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "ERROR: GITLAB_TOKEN is empty"
            exit 1
          fi

          echo "GITLAB_TOKEN is available"

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://git-action:${GITLAB_TOKEN}@git.cpe.kmutt.ac.th/senior-droneswarm/drone-aquarius.git"
          git push gitlab main:main --force