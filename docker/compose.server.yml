# VM SERVER — PX4 SITL + Gazebo (+ noVNC viewers + telemetry / camera + Grafana dashboard). Pull-only: no git clone, no build.
# The VM needs only this file and a .env next to it:
#
#   docker compose -f compose.server.yml pull
#   docker compose -f compose.server.yml up -d
#   docker compose -f compose.server.yml logs -f px4-sim
#
# Required in .env: CONTROL_HOST=<control computer IP>
#
# Telemetry / camera (service telemetry, details: telemetry_plan.md):
#   camera in the browser  http://<VM_IP>:8083/          (needs a camera model, e.g. gz_x500_mono_cam_down)
#   dashboard (Grafana)    http://<VM_IP>:3000   (admin / GRAFANA_ADMIN_PASSWORD from .env)
#     PX4 MAVLink -> telemetry (mavlink_mqtt.py) -> mosquitto :1883 -> telegraf -> timescaledb (127.0.0.1:5432) -> grafana
#   raw MQTT               mosquitto_sub -h <VM_IP> -t 'aquarius/#' -v
# Needs Docker Compose >= 2.23.1 (inline `configs: content`).
#   ROS 2 on the VM        docker exec telemetry with-ros ros2 topic list
name: aquarius-server

services:

  px4-sim:
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-px4-sim:${TAG:-latest}
    container_name: px4-sim
    # host network: UDP MAVLink / Gazebo transport without Docker NAT in between
    network_mode: host
    environment:
      - CONTROL_HOST=${CONTROL_HOST:?set CONTROL_HOST=<control computer IP> in .env}
      - PX4_NUM_DRONES=${PX4_NUM_DRONES:-1}
      - PX4_GZ_WORLD=${PX4_GZ_WORLD:-baylands}
      - PX4_SIM_MODEL=${PX4_SIM_MODEL:-gz_x500}
      - PX4_SYS_AUTOSTART=${PX4_SYS_AUTOSTART:-4001}
      - DRONE_SPACING=${DRONE_SPACING:-3}
      - HEADLESS=${HEADLESS:-}
      - QGC=${QGC:-1}                       # QGroundControl in its own noVNC (:8082)
      - SCREEN_SIZE=${SCREEN_SIZE:-1920x1080x24}
      - GZ_FOLLOW=${GZ_FOLLOW-0}            # Gazebo camera follows drone N (empty = free camera)
      - GZ_PARTITION=${GZ_PARTITION:-aquarius}   # Gazebo transport partition, same in telemetry
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}        # PX4 uXRCE-DDS domain, same in telemetry
      # drone camera models: GstCameraSystem streams RTP/H.264 to this IP, udp 5600+i (127.0.0.1 = QGC in noVNC)
      - PX4_VIDEO_HOST_IP=${PX4_VIDEO_HOST_IP:-127.0.0.1}
      # drone camera size / rate (CPU rendering: 1280x960@30 -> RTF ~0.03), empty = model default
      - CAMERA_WIDTH=${CAMERA_WIDTH-640}
      - CAMERA_HEIGHT=${CAMERA_HEIGHT-480}
      - CAMERA_RATE=${CAMERA_RATE-10}
      - VNC_LISTEN=127.0.0.1                # VNC only reachable through noVNC
      - TELEM=${TELEM:-1}                   # 3rd MAVLink link 14740+i -> 127.0.0.1:14700 (telemetry -> MQTT)
    volumes:
      - gz-fuel-cache:/root/.gz/fuel
    stop_grace_period: 10s
    restart: unless-stopped

  novnc:
    image: dougw/novnc
    container_name: novnc
    network_mode: host                      # Gazebo: http://<VM_IP>:8081/vnc.html
    environment:
      - REMOTE_HOST=127.0.0.1
      - REMOTE_PORT=5900
    depends_on:
      - px4-sim
    restart: unless-stopped

  novnc-qgc:
    image: dougw/novnc
    container_name: novnc-qgc
    network_mode: host                      # QGroundControl: http://<VM_IP>:8082/vnc.html
    # image always listens on 8081 -> override, host network has only one 8081
    command: /root/noVNC/utils/launch.sh --vnc 127.0.0.1:5901 --listen 8082 --web /root/noVNC/build/
    depends_on:
      - px4-sim
    restart: unless-stopped

  telemetry:
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-telemetry:${TAG:-latest}
    container_name: telemetry
    # host network = px4-sim's network: PX4 uXRCE client -> 127.0.0.1:8888, Gazebo transport discovery
    network_mode: host
    ipc: host                               # ROS 2 / Fast-DDS shared memory with other host-network ROS nodes
    environment:
      - PX4_NUM_DRONES=${PX4_NUM_DRONES:-1}  # same as px4-sim -> topic names
      - PX4_GZ_WORLD=${PX4_GZ_WORLD:-baylands}
      - PX4_SIM_MODEL=${PX4_SIM_MODEL:-gz_x500}
      - GZ_PARTITION=${GZ_PARTITION:-aquarius}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - GZ_CAMERA=${GZ_CAMERA-}             # camera "<link>/<sensor>", empty = from PX4_SIM_MODEL, none = off
      - WEB_VIDEO_PORT=${WEB_VIDEO_PORT:-8083}
      - MQTT_URL=${MQTT_URL-mqtt://127.0.0.1:1883}   # MAVLink -> MQTT for Grafana, empty = off
      - FLEET=${FLEET:-sim}
      - GT_RATE=${GT_RATE-30}                # ground truth Hz (/uav_i/gz/ground_truth), empty = off
      - RECORD=${RECORD:-}                  # 1 = ros2 bag (mcap) -> data/bags/<date>
      - RECORD_REGEX=${RECORD_REGEX:-.*/fmu/out/.*|/uav_[0-9]+/gz/.*}
    volumes:
      - ./data:/data                        # bags on the VM: ~/aquarius/data/bags
    depends_on:
      - px4-sim
    stop_grace_period: 10s
    restart: unless-stopped

  # --- dashboard: MQTT -> Telegraf -> TimescaleDB -> Grafana (communication_plan.md §4, §7), all host network
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    network_mode: host                      # MQTT 1883, WebSocket 9001 — LAN / VPN only (no auth yet)
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
        mode: 0444
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.22.1-pg17
    container_name: timescaledb
    network_mode: host
    # SQL on the VM only (ssh -L 5432:127.0.0.1:5432 for psql / a DB tool); TSDB_PORT if 5432 is taken
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=${TSDB_PORT:-5432}"]
    environment:
      - POSTGRES_USER=aquarius              # user / password / DB: first start only (empty volume)
      - POSTGRES_PASSWORD=${TSDB_PASSWORD:-aquarius-admin}
      - POSTGRES_DB=aquarius
      - TIMESCALEDB_TELEMETRY=off
      - TS_TUNE_MEMORY=${TSDB_MEMORY:-1GB}    # timescaledb-tune: don't size for the whole VM (Gazebo needs it)
      - TS_TUNE_NUM_CPUS=2
    configs:
      - source: timescaledb_init
        target: /docker-entrypoint-initdb.d/zz-aquarius.sql
        mode: 0444
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:                            # TCP: the init server (first start) only listens on the socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${TSDB_PORT:-5432} -U aquarius -d aquarius"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  telegraf:
    image: telegraf:1.36
    container_name: telegraf
    network_mode: host
    environment:
      - MQTT_SERVER=tcp://127.0.0.1:1883
      - TSDB_DSN=host=127.0.0.1 port=${TSDB_PORT:-5432} user=aquarius password=${TSDB_PASSWORD:-aquarius-admin} dbname=aquarius sslmode=disable
      - TSDB_RETENTION=${TSDB_RETENTION-30d}
    configs:
      - source: telegraf_conf
        target: /etc/telegraf/telegraf.conf
        mode: 0444                          # telegraf runs as user telegraf
    depends_on:
      mosquitto:
        condition: service_started
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-grafana:${TAG:-latest}
    container_name: grafana
    network_mode: host                      # dashboard: http://<VM_IP>:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - TSDB_HOST=127.0.0.1:${TSDB_PORT:-5432}
      - TSDB_PASSWORD=${TSDB_PASSWORD:-aquarius-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - timescaledb
    restart: unless-stopped

volumes:
  gz-fuel-cache:
  timescaledb-data:                         # flight history (TSDB_RETENTION)
  grafana-data:

# Same text in compose.local.yml — keep both in sync. $$ = literal $ (Telegraf reads the env itself).
configs:
  mosquitto_conf:
    content: |
      # no auth yet (communication_plan.md M4: passwords + ACL) — keep 1883 / 9001 on LAN / VPN
      listener 1883
      listener 9001
      protocol websockets
      allow_anonymous true
      persistence false
  telegraf_conf:
    content: |
      # MQTT aquarius/<fleet>/drone/<i>/<stream> {"t": ms, ...} -> TimescaleDB table <stream>, columns time, fleet, drone, fields
      [agent]
        interval = "1s"
        flush_interval = "1s"
        omit_hostname = true
        skip_processors_after_aggregators = false
      [[inputs.mqtt_consumer]]
        servers = ["$${MQTT_SERVER}"]
        topics = ["aquarius/+/drone/+/+"]
        client_id = "aquarius-telegraf"
        topic_tag = ""
        data_format = "json"
        json_time_key = "t"
        json_time_format = "unix_ms"
        json_string_fields = ["mode", "landed", "system_status", "text"]
        [[inputs.mqtt_consumer.topic_parsing]]
          topic = "aquarius/+/drone/+/+"
          measurement = "_/_/_/_/measurement"
          tags = "_/fleet/_/drone/_"
      [[outputs.postgresql]]
        connection = "$${TSDB_DSN}"
        timestamp_column_type = "timestamp with time zone"
        # new stream -> table + hypertable / index / retention (aquarius_hypertable from timescaledb_init)
        create_templates = [
          '''CREATE TABLE {{ .table }} ({{ .columns }})''',
          '''SELECT aquarius_hypertable({{ .table|quoteLiteral }}, '$${TSDB_RETENTION}')''',
        ]
  timescaledb_init:
    content: |
      -- runs once on an empty timescaledb-data volume
      CREATE EXTENSION IF NOT EXISTS timescaledb;
      -- Telegraf calls this right after creating a stream's table (position, status, battery, ...)
      CREATE OR REPLACE FUNCTION aquarius_hypertable(tbl regclass, retention text) RETURNS void
      LANGUAGE plpgsql AS $$body$$
      BEGIN
        PERFORM create_hypertable(tbl, by_range('time', INTERVAL '1 day'), migrate_data => true);
        EXECUTE format('CREATE INDEX ON %s (fleet, drone, time DESC)', tbl);   -- "last value per drone"
        IF coalesce(retention, '') NOT IN ('', '0') THEN                      -- '' / 0 = keep forever
          PERFORM add_retention_policy(tbl, retention::interval);
        END IF;
      END
      $$body$$;
