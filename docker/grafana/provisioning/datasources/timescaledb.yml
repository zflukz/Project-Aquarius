# TimescaleDB + PostGIS (one database `aquarius` for both dashboards):
#   Telegraf (MQTT aquarius/<fleet>/drone/<i>/<stream>) -> one hypertable per stream (position, status, ...)
#   ingestion (Kafka, profile pipeline) -> telemetry, detections, missions, grid_cells, ... (docker/db/migrations)
apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: aquarius-tsdb
    type: grafana-postgresql-datasource
    access: proxy
    url: $TSDB_HOST
    user: $TSDB_USER
    isDefault: true
    jsonData:
      database: $TSDB_DB
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
      timeInterval: 1s
    secureJsonData:
      password: $TSDB_PASSWORD
