# InfluxDB 2 (Flux), filled by Telegraf from MQTT aquarius/<fleet>/drone/<i>/<stream>
apiVersion: 1
datasources:
  - name: InfluxDB
    uid: aquarius-influx
    type: influxdb
    access: proxy
    url: $INFLUX_URL
    isDefault: true
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
      timeInterval: 1s
    secureJsonData:
      token: $INFLUX_TOKEN
