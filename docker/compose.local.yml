# LOCAL TEST — everything on your computer: px4-sim + novnc + telemetry + dashboard + drone-control.
# Also the place where images are built and pushed for the VM server.
#
#   cd docker
#   docker compose -f compose.local.yml up -d --build          # run all locally
#   docker compose -f compose.local.yml exec drone-control \
#     bash -c "source /opt/ros/jazzy/setup.bash && python3 flight_test.py"
#   docker compose -f compose.local.yml push px4-sim telemetry grafana drone-control   # publish for the VM
#
# Dashboard: Grafana http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD), camera http://localhost:8083/
#   PX4 MAVLink -> telemetry (mavlink_mqtt.py) -> mosquitto -> telegraf -> timescaledb -> grafana
#   (docker/communication_plan.md). Raw MQTT: docker exec mosquitto mosquitto_sub -t 'aquarius/#' -v
# Data pipeline (profile `pipeline`, off by default): Gazebo drones -> telemetry (aquarius_bridge) -> Kafka
#   -> ingestion -> TimescaleDB -> Grafana "Mission monitor". On demand: aquarius pipeline up;
#   always: COMPOSE_PROFILES=pipeline in .env. Camera :8090, Kafka UI :8084, Kafka :9092 (README "Data pipeline").
name: aquarius-local

services:

  px4-sim:
    build:
      context: ./px4-sim
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-px4-sim:${TAG:-latest}
    container_name: px4-sim
    networks:
      - drone-net
    environment:
      - CONTROL_HOST=drone-control          # PX4 sends MAVLink to the drone-control container
      - PX4_NUM_DRONES=${PX4_NUM_DRONES:-1}
      - PX4_GZ_WORLD=${PX4_GZ_WORLD:-baylands}
      - PX4_SIM_MODEL=${PX4_SIM_MODEL:-gz_x500}
      - PX4_SYS_AUTOSTART=${PX4_SYS_AUTOSTART:-4001}
      - DRONE_SPACING=${DRONE_SPACING:-3}
      - HEADLESS=${HEADLESS:-}
      - QGC=${QGC:-1}                       # QGroundControl in its own noVNC (:8082)
      - SCREEN_SIZE=${SCREEN_SIZE:-1920x1080x24}
      - GZ_FOLLOW=${GZ_FOLLOW-0}            # Gazebo camera follows drone N (empty = free camera)
      - GZ_PARTITION=${GZ_PARTITION:-aquarius}   # Gazebo transport partition, same in telemetry
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}        # PX4 uXRCE-DDS domain, same in telemetry
      # drone camera models: GstCameraSystem streams RTP/H.264 to this IP, udp 5600+i (127.0.0.1 = QGC in noVNC)
      - PX4_VIDEO_HOST_IP=${PX4_VIDEO_HOST_IP:-127.0.0.1}
      # drone camera size / rate (CPU rendering: 1280x960@30 -> RTF ~0.03), empty = model default
      - CAMERA_WIDTH=${CAMERA_WIDTH-640}
      - CAMERA_HEIGHT=${CAMERA_HEIGHT-480}
      - CAMERA_RATE=${CAMERA_RATE-10}
      - TELEM=${TELEM:-1}                   # 3rd MAVLink link 14740+i -> 127.0.0.1:14700 (telemetry -> MQTT)
    ports:                                  # served by telemetry (it shares this network namespace)
      - "8083:8083"                         # camera: http://localhost:8083/
    volumes:
      - gz-fuel-cache:/root/.gz/fuel        # keep downloaded worlds (Baylands) across rebuilds
    stop_grace_period: 10s
    restart: unless-stopped

  novnc:
    image: dougw/novnc
    container_name: novnc
    networks:
      - drone-net
    ports:
      - "8080:8081"                         # Gazebo: http://localhost:8080/vnc.html
    environment:
      - REMOTE_HOST=px4-sim
      - REMOTE_PORT=5900
    depends_on:
      - px4-sim

  novnc-qgc:
    image: dougw/novnc
    container_name: novnc-qgc
    networks:
      - drone-net
    ports:
      - "8082:8081"                         # QGroundControl: http://localhost:8082/vnc.html
    environment:
      - REMOTE_HOST=px4-sim
      - REMOTE_PORT=5901
    depends_on:
      - px4-sim

  telemetry:
    build:
      context: ./telemetry
      additional_contexts:
        pipeline: ../Data-Pipeline        # aquarius_bridge (ROS 2 -> Kafka) source
      args:
        # px4_msgs must match px4-sim's PX4: PX4_REF=$(docker exec px4-sim git -C /px4 rev-parse HEAD)
        PX4_REF: ${PX4_REF:-main}
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-telemetry:${TAG:-latest}
    container_name: telemetry
    # px4-sim's network namespace: PX4 uXRCE client -> 127.0.0.1:8888, Gazebo transport discovery.
    # If px4-sim is recreated / restarted, restart this too (it keeps the old namespace otherwise).
    network_mode: service:px4-sim
    environment:
      - PX4_NUM_DRONES=${PX4_NUM_DRONES:-1}  # same as px4-sim -> topic names
      - PX4_GZ_WORLD=${PX4_GZ_WORLD:-baylands}
      - PX4_SIM_MODEL=${PX4_SIM_MODEL:-gz_x500}
      - GZ_PARTITION=${GZ_PARTITION:-aquarius}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - GZ_CAMERA=${GZ_CAMERA-}             # camera "<link>/<sensor>", empty = from PX4_SIM_MODEL, none = off
      - WEB_VIDEO_PORT=${WEB_VIDEO_PORT:-8083}
      - MQTT_URL=${MQTT_URL-mqtt://mosquitto:1883}   # MAVLink -> MQTT for Grafana, empty = off
      - FLEET=${FLEET:-sim}
      - GT_RATE=${GT_RATE-30}                # ground truth Hz (/uav_i/gz/ground_truth), empty = off
      - RECORD=${RECORD:-}                  # 1 = ros2 bag (mcap) -> data/bags/<date>
      - RECORD_REGEX=${RECORD_REGEX:-.*/fmu/out/.*|/uav_[0-9]+/gz/.*}
      # aquarius_bridge: the drones' ROS 2 topics -> Kafka, starts once Kafka answers (profile pipeline); empty = off
      - KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP-kafka:19092}
      - MISSION_ID=${MISSION_ID:-}             # empty = new mission UUID at every telemetry start
      - BRIDGE_IMAGE_FPS=${BRIDGE_IMAGE_FPS:-2} # camera frames / s per drone into Kafka
    volumes:
      - ./data:/data                        # bags: docker/data/bags
    depends_on:
      px4-sim:
        condition: service_started
        restart: true
    stop_grace_period: 10s

  # --- dashboard: MQTT -> Telegraf -> TimescaleDB -> Grafana (docker/communication_plan.md §4, §7)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    networks:
      - drone-net
    ports:
      - "1883:1883"                         # MQTT: mosquitto_sub -h localhost -t 'aquarius/#' -v
      - "9001:9001"                         # MQTT over WebSocket (browser apps)
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
        mode: 0444
    restart: unless-stopped

  timescaledb:
    build:
      context: ./timescaledb
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-timescaledb:${TAG:-latest}   # PostgreSQL 17 + TimescaleDB + PostGIS (small)
    container_name: timescaledb
    networks:
      - drone-net
    ports:
      - "127.0.0.1:5432:5432"               # SQL (local only): psql -h localhost -U aquarius aquarius
    environment:
      - POSTGRES_USER=aquarius              # user / password / DB: first start only (empty volume)
      - POSTGRES_PASSWORD=${TSDB_PASSWORD:-aquarius-admin}
      - POSTGRES_DB=aquarius
      - TIMESCALEDB_TELEMETRY=off
      - TS_TUNE_MEMORY=${TSDB_MEMORY:-1GB}    # timescaledb-tune: don't size for the whole host (Gazebo needs it)
      - TS_TUNE_NUM_CPUS=2
    configs:
      - source: timescaledb_init
        target: /docker-entrypoint-initdb.d/zz-aquarius.sql
        mode: 0444
    volumes:
      - tsdb-pgdata:/var/lib/postgresql/data
    healthcheck:                            # TCP: the init server (first start) only listens on the socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aquarius -d aquarius"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  telegraf:
    image: telegraf:1.36
    container_name: telegraf
    networks:
      - drone-net
    environment:
      - MQTT_SERVER=tcp://mosquitto:1883
      - TSDB_DSN=host=timescaledb port=5432 user=aquarius password=${TSDB_PASSWORD:-aquarius-admin} dbname=aquarius sslmode=disable
      - TSDB_RETENTION=${TSDB_RETENTION-30d}
    configs:
      - source: telegraf_conf
        target: /etc/telegraf/telegraf.conf
        mode: 0444                          # telegraf runs as user telegraf
    depends_on:
      mosquitto:
        condition: service_started
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    build:
      context: ./grafana
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-grafana:${TAG:-latest}
    container_name: grafana
    networks:
      - drone-net
    ports:
      - "3000:3000"                         # dashboard: http://localhost:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - TSDB_HOST=timescaledb:5432
      - TSDB_PASSWORD=${TSDB_PASSWORD:-aquarius-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - timescaledb
    restart: unless-stopped

  # --- data pipeline (profile `pipeline`): Gazebo drones -> telemetry (aquarius_bridge, ROS 2) -> Kafka
  #     -> ingestion -> TimescaleDB (docker/db/migrations) -> Grafana "Mission monitor". README "Data pipeline".
  #     on demand: aquarius pipeline up / down      always: COMPOSE_PROFILES=pipeline in .env
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    profiles: [pipeline]
    networks:
      - drone-net
    ports:
      - "9092:9092"                         # bridge / tools outside Docker: localhost:9092
    environment:
      KAFKA_NODE_ID: 1                                  # KRaft: one node = broker + controller
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL = other containers (kafka:19092), EXTERNAL = the host / other machines (KAFKA_ADVERTISED_HOST:9092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1         # single broker: every replication factor is 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"          # topics only from kafka-init (A3)
      KAFKA_MESSAGE_MAX_BYTES: 2097152                  # 2 MB: image-frames
      KAFKA_REPLICA_FETCH_MAX_BYTES: 2097152
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms512m}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-init:                               # creates the 5 topics (A3), then exits 0
    image: apache/kafka:3.8.0
    container_name: kafka-init
    profiles: [pipeline]
    networks:
      - drone-net
    environment:
      BOOTSTRAP: kafka:19092
      PARTITIONS: ${KAFKA_PARTITIONS:-10}            # = max drones; set before the first start
    configs:
      - source: kafka_topics
        target: /create-topics.sh
        mode: 0555
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  db-migrate:                               # applies docker/db/migrations (baked into the image), then exits 0
    # status: docker compose -f <file> run --rm db-migrate python -m aquarius_ingest.migrate --status
    build:
      context: ..                           # repo root: schemas in Data-Pipeline/, migrations in docker/db/
      dockerfile: docker/ingestion/Dockerfile
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-ingestion:${TAG:-latest}
    container_name: db-migrate
    profiles: [pipeline]
    networks:
      - drone-net
    environment:
      PG_DSN: postgresql://aquarius:${TSDB_PASSWORD:-aquarius-admin}@timescaledb:5432/aquarius
    command: ["python", "-m", "aquarius_ingest.migrate"]
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  ingestion:                                # Kafka -> schema check -> TimescaleDB (bad messages -> ingest_rejects)
    build:
      context: ..                           # repo root: schemas in Data-Pipeline/, migrations in docker/db/
      dockerfile: docker/ingestion/Dockerfile
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-ingestion:${TAG:-latest}
    container_name: ingestion
    profiles: [pipeline]
    networks:
      - drone-net
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PG_DSN: postgresql://aquarius:${TSDB_PASSWORD:-aquarius-admin}@timescaledb:5432/aquarius
      BATCH_MAX: 500
      BATCH_MAX_WAIT_S: 1.0
      MERGE_RADIUS_M: ${MERGE_RADIUS_M:-3.0}          # C5: detections closer than this = same person
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  imagestream:                              # MJPEG of every drone from Kafka image-frames (Mission dashboard)
    build:
      context: ./imagestream
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-imagestream:${TAG:-latest}
    container_name: imagestream
    profiles: [pipeline]
    networks:
      - drone-net
    ports:
      - "${IMAGESTREAM_PORT:-8090}:8090"     # camera from Kafka: http://localhost:8090/
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    profiles: [pipeline]
    networks:
      - drone-net
    ports:
      - "${KAFKA_UI_PORT:-8084}:8080"         # Kafka UI: http://localhost:8084
    environment:
      KAFKA_CLUSTERS_0_NAME: aquarius
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  drone-control:
    build:
      context: ..
      dockerfile: docker/drone-control/Dockerfile
    image: ${REGISTRY:-ghcr.io/zflukz}/aquarius-drone-control:${TAG:-latest}
    container_name: drone-control
    init: true                              # reaps exited mavsdk_server (aquarius rtl / stop) -> no zombies
    networks:
      - drone-net
    environment:
      - DRONE_ID=${DRONE_ID:-0}
      # optional: run once at start, e.g. AUTO_RUN=python3 mcpp_mission.py (MCPP coverage flight)
      - AUTO_RUN=${AUTO_RUN:-}
      - NUM_DRONES=${NUM_DRONES:-1}           # mcpp_mission.py: drones flown together
      - AREA_W=${AREA_W:-80}                  # mcpp_mission.py: area east-west, m
      - AREA_H=${AREA_H:-60}                  #                  area north-south, m
      - SWEEP=${SWEEP:-5}                     #                  line spacing, m
      - ALT=${ALT:-20}                        #                  altitude, m
      - SPEED=${SPEED:-5}                     #                  m/s
    # stays up as the control station — run scripts with `docker compose exec`
    command: sleep infinity
    stdin_open: true
    tty: true

networks:
  drone-net:
    driver: bridge

volumes:
  gz-fuel-cache:
  tsdb-pgdata:                              # TimescaleDB: flight history (TSDB_RETENTION) + pipeline tables
  kafka-data:                               # profile pipeline
  grafana-data:

# Same text in compose.server.yml — keep both in sync. $$ = literal $ (Telegraf reads the env itself).
configs:
  mosquitto_conf:
    content: |
      # no auth yet (communication_plan.md M4: passwords + ACL) — keep 1883 / 9001 on LAN / VPN
      listener 1883
      listener 9001
      protocol websockets
      allow_anonymous true
      persistence false
  telegraf_conf:
    content: |
      # MQTT aquarius/<fleet>/drone/<i>/<stream> {"t": ms, ...} -> TimescaleDB table <stream>, columns time, fleet, drone, fields
      [agent]
        interval = "1s"
        flush_interval = "1s"
        omit_hostname = true
        skip_processors_after_aggregators = false
      [[inputs.mqtt_consumer]]
        servers = ["$${MQTT_SERVER}"]
        topics = ["aquarius/+/drone/+/+"]
        client_id = "aquarius-telegraf"
        topic_tag = ""
        data_format = "json"
        json_time_key = "t"
        json_time_format = "unix_ms"
        json_string_fields = ["mode", "landed", "system_status", "text"]
        [[inputs.mqtt_consumer.topic_parsing]]
          topic = "aquarius/+/drone/+/+"
          measurement = "_/_/_/_/measurement"
          tags = "_/fleet/_/drone/_"
      [[outputs.postgresql]]
        connection = "$${TSDB_DSN}"
        timestamp_column_type = "timestamp with time zone"
        # new stream -> table + hypertable / index / retention (aquarius_hypertable from timescaledb_init)
        create_templates = [
          '''CREATE TABLE {{ .table }} ({{ .columns }})''',
          '''SELECT aquarius_hypertable({{ .table|quoteLiteral }}, '$${TSDB_RETENTION}')''',
        ]
  timescaledb_init:
    content: |
      -- runs once on an empty tsdb-data volume (pipeline tables: docker/db/migrations via db-migrate)
      CREATE EXTENSION IF NOT EXISTS timescaledb;
      CREATE EXTENSION IF NOT EXISTS postgis;
      -- Telegraf calls this right after creating a stream's table (position, status, battery, ...)
      CREATE OR REPLACE FUNCTION aquarius_hypertable(tbl regclass, retention text) RETURNS void
      LANGUAGE plpgsql AS $$body$$
      BEGIN
        PERFORM create_hypertable(tbl, by_range('time', INTERVAL '1 day'), migrate_data => true);
        EXECUTE format('CREATE INDEX ON %s (fleet, drone, time DESC)', tbl);   -- "last value per drone"
        IF coalesce(retention, '') NOT IN ('', '0') THEN                      -- '' / 0 = keep forever
          PERFORM add_retention_policy(tbl, retention::interval);
        END IF;
      END
      $$body$$;
  kafka_topics:
    content: |
      #!/usr/bin/env bash
      # Creates every Kafka topic with the settings agreed in Phase A (A3).
      # Safe to run again: existing topics are left as they are.
      set -euo pipefail

      BOOTSTRAP="$${BOOTSTRAP:-localhost:9092}"
      PARTITIONS="$${PARTITIONS:-10}"   # = max drones (10)
      KT=/opt/kafka/bin/kafka-topics.sh

      DAY_MS=86400000

      create() {
        local topic="$$1" parts="$$2"; shift 2
        local configs=()
        for c in "$$@"; do configs+=(--config "$$c"); done
        "$$KT" --bootstrap-server "$$BOOTSTRAP" --create --if-not-exists \
              --topic "$$topic" --partitions "$$parts" --replication-factor 1 "$${configs[@]}"
      }

      create telemetry         "$$PARTITIONS" "retention.ms=$$((7 * DAY_MS))"
      # 10 drones x 2 fps x ~165 KB = ~3.3 MB/s. retention.bytes caps each partition at
      # 2 GB (20 GB for the topic) so a long run can never fill the ground-station disk.
      create image-frames      "$$PARTITIONS" "retention.ms=$$DAY_MS" "retention.bytes=2147483648" "max.message.bytes=2097152"
      create detections        "$$PARTITIONS" "retention.ms=$$((7 * DAY_MS))"
      create survivors         "$$PARTITIONS" "retention.ms=$$((30 * DAY_MS))"
      # One partition: keeps the order of events across all drones in a mission (A3)
      create replanning-events 1             "retention.ms=$$((30 * DAY_MS))"

      echo "Topics now on the broker:"
      "$$KT" --bootstrap-server "$$BOOTSTRAP" --describe \
        --topic 'telemetry|image-frames|detections|survivors|replanning-events' \
        | grep -E '^Topic:' || true
