# Bridge settings for the multi-drone SITL test with cameras (tools/sitl/start_swarm.sh).
# Run with:
#   ros2 launch aquarius_bridge bridge.launch.py use_sim_time:=true \
#     config:=$(ros2 pkg prefix aquarius_bridge)/share/aquarius_bridge/config/bridge_sitl.yaml
#
# Differences from bridge.yaml:
#   * cameras come raw from ros_gz_bridge (/uavN/camera/image) -> image_input: raw (needs python3-opencv)
#   * use_sim_time:=true so image stamps (Gazebo sim time) and PX4 timestamps end on one clock (A4)
aquarius_bridge:
  ros__parameters:
    kafka_bootstrap: "localhost:9092"
    mission_id: ""
    drones:
      - "uav1,/uav_1,/uav1/camera/image"
      - "uav2,/uav_2,/uav2/camera/image"
      - "uav3,/uav_3,/uav3/camera/image"
      - "uav4,/uav_4,/uav4/camera/image"
      - "uav5,/uav_5,/uav5/camera/image"
      - "uav6,/uav_6,/uav6/camera/image"
      - "uav7,/uav_7,/uav7/camera/image"
      - "uav8,/uav_8,/uav8/camera/image"
      - "uav9,/uav_9,/uav9/camera/image"
      - "uav10,/uav_10,/uav10/camera/image"
    telemetry_hz: 10.0
    max_image_fps: 2.0
    image_input: "raw"
    jpeg_quality: 80
    px4_time_mode: "estimate_offset"
    topic_global_position: "fmu/out/vehicle_global_position"
    topic_local_position: "fmu/out/vehicle_local_position_v1"
    topic_attitude: "fmu/out/vehicle_attitude"
    topic_battery: "fmu/out/battery_status_v1"
    topic_status: "fmu/out/vehicle_status_v4"
    stats_period_s: 10.0
